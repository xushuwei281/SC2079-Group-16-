[workspace]
name = "mdp-ros2-ws"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]

# The Pi runs Debian 13 (trixie, glibc 2.41); any x86 laptop built in the
# last decade clears this too. Without this, the solver assumes conda-forge's
# 2.17 baseline when locking off-machine and rejects libudev1/libcamera,
# which camera_ros needs (added 2026-08-26).
[system-requirements]
linux = "5.15"
libc = { version = "2.34", family = "glibc" }

# ============================================================================
# The ROS2 graph is split across two hosts (see ARCHITECTURE.md, "Design
# principle"), so the dependencies are split the same way — ONE source tree,
# TWO environments:
#
#   pixi run -e pi build     Raspberry Pi 4B    (linux-aarch64)
#   pixi run -e pc build     laptop/PC or Mac   (linux-64, osx-arm64)
#
# The source tree is deliberately NOT split into two workspaces.
# mdp_interfaces is shared by both hosts, and ROS2 hashes message definitions
# into the type name — two copies that drift by one field give you nodes that
# build clean, start clean, discover each other, and then silently never
# deliver. A single copy makes that failure impossible.
#
# There is no usable `default` environment on purpose: every dependency lives
# in a feature, so `pixi run build` without -e fails immediately with "task
# not found" instead of quietly building against the wrong dependency set.
# ============================================================================

# ----------------------------------------------------------------------------
# common — everything BOTH hosts need.
#
# Anything added here lands on the Pi as well. Keep heavy things out: torch,
# ultralytics, rviz2 and the CUDA stack belong in [feature.pc]. Before adding
# a dependency here, ask "does a node that physically runs on the Pi need
# this?" — if not, it goes under pc.
# ----------------------------------------------------------------------------
[feature.common.dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-rclpy = "*"
ros-jazzy-ros2cli = "*"

# Build toolchain. mdp_interfaces is an ament_cmake package with rosidl
# generation and both hosts build it, so both need a compiler.
pkg-config = "*"
compilers = "*"
make = "*"
ninja = "*"
colcon-common-extensions = "*"

# Serial. The Pi needs it at runtime (UART to the STM32, Bluetooth RFCOMM to
# the tablet); the PC needs it because serial_bridge_node's packet-encoding
# tests import `serial` without ever opening a port. Pure Python, ~100KB.
pyserial = ">=3.5,<4"

# TF. Whichever node ends up owning dead-reckoned pose publishes
# odom -> base_link, and which node that is is still an open decision
# (planner on the PC vs serial_bridge_node on the Pi), so both get tf2.
ros-jazzy-tf2-ros = ">=0.36.20,<0.37"

# Image transport plugins must exist on BOTH ends of a compressed topic: the
# Pi's camera driver publishes, mdp_perception on the PC subscribes.
ros-jazzy-image-transport = ">=5.1.7,<6"
ros-jazzy-compressed-image-transport = ">=4.0.7,<5"

# Zenoh RMW for unicast TCP/QUIC over Tailscale/Wi-Fi (bypasses UDP multicast block)
ros-jazzy-rmw-zenoh-cpp = "*"

[feature.common.pypi-dependencies]
pygame = ">=2.5.0"
onnxruntime = ">=1.17.0"

[feature.common.tasks]
clean = { cmd = "rm -rf build install log", description = "Remove colcon build artifacts (build, install, log)" }
sim = { cmd = "python3 ../algorithm/simulator.py", description = "Launch the interactive 2D arena simulator" }
planner = { cmd = "python3 ../algorithm/planner.py", description = "Run the CLI path planning algorithm demo" }
test-algo = { cmd = "python3 -m unittest discover -s ../algorithm/test -p 'test_*.py'", description = "Run algorithm unit tests" }
test-bridge = { cmd = "env RMW_IMPLEMENTATION=rmw_cyclonedds_cpp python3 -m unittest discover -s src/mdp_hardware_bridge/test -p 'test_*.py' && env RMW_IMPLEMENTATION=rmw_cyclonedds_cpp python3 -m unittest discover -s src/mdp_android_bridge/test -p 'test_*.py'", description = "Run hardware & Android bridge unit tests" }
test-planner = { cmd = "env RMW_IMPLEMENTATION=rmw_cyclonedds_cpp python3 -m unittest discover -s src/mdp_bringup/test -p 'test_*.py'", description = "Run autonomous planner FSM unit tests" }
test-all = { cmd = "pixi run -e pi test-algo && pixi run -e pi test-bridge && pixi run -e pi test-planner", description = "Run all unit test suites across algorithm, bridges, and planner" }
# -u ZENOH_SESSION_CONFIG_URI: this task is shared by pi/pc, both of whose
# activation scripts point that var at a mode:"client" config (client sessions
# only connect, they never listen). The router process needs mode:"router" with
# an actual listen endpoint, so it must run with that var unset rather than
# inherited — otherwise it silently fails to bind port 7447. See
# config/zenoh_router_pi.json5 for the launch-file equivalent of this override.
zenoh = { cmd = "env -u ZENOH_SESSION_CONFIG_URI ros2 run rmw_zenoh_cpp rmw_zenohd", description = "Start Zenoh router for Tailscale / multi-host networking" }

# Sourced on activation; created by the first colcon build.
[feature.common.activation]
scripts = ["install/setup.bash"]

[feature.common.activation.env]
# Group 16's dedicated ROS2 domain. On demo day this runs on its own
# router/hotspot (isolated broadcast domain, no other MDP groups on the same
# subnet), so this isn't preventing cross-team collisions — it's just hygiene
# against any other stray ROS2 process on domain 0. Must match on every
# machine joining this graph. Defined once, in the feature both environments
# share, on purpose: two copies of this number is exactly the kind of thing
# that drifts and costs an evening.
ROS_DOMAIN_ID = "16"
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ZENOH_ROUTER_CHECK_ATTEMPTS = "10"

# ----------------------------------------------------------------------------
# pi — hardware-bound nodes: UART to the STM32, Bluetooth to the tablet,
# camera capture, and on-device ONNX perception.
# ----------------------------------------------------------------------------
[feature.pi]
platforms = ["linux-aarch64"]

[feature.pi.dependencies]
# Foxglove Studio websocket bridge (default ws://<pi>:8765) for live
# visualization/debugging from a laptop.
ros-jazzy-foxglove-bridge = "*"

[feature.pi.pypi-dependencies]
# NCNN inference for mdp_perception's edge target -- ARM-NEON-tuned, no
# torch pulled in (unlike ultralytics, which stays pc-only; see the
# [feature.pc] comment below).
ncnn = "*"

[feature.pi.tasks]
# Explicit list of what runs on the robot.
build = { cmd = "colcon build --packages-up-to mdp_hardware_bridge mdp_android_bridge mdp_camera_bringup mdp_bringup mdp_perception", description = "Build all robot packages (including on-board perception)" }
test = { cmd = "colcon test --packages-up-to mdp_hardware_bridge mdp_android_bridge mdp_camera_bringup mdp_bringup mdp_perception", description = "Test robot packages" }
robot = { cmd = "ros2 launch mdp_bringup robot.launch.py", description = "Start full autonomous robot stack (Zenoh, STM32, Android, Camera, Planner, Perception, Foxglove)" }
robot-no-cv = { cmd = "ros2 launch mdp_bringup robot.launch.py run_perception:=false", description = "Start autonomous stack WITHOUT on-board perception (runs perception on laptop or off)" }
task2 = { cmd = "ros2 launch mdp_bringup task2.launch.py", description = "Start Task 2 fastest car sprint stack (Zenoh, STM32, Android, Camera, FastestCarNode, Perception, Foxglove)" }
hardware = { cmd = "ros2 launch mdp_bringup hardware.launch.py", description = "Start essential low-level hardware stack (Zenoh, STM32 UART, Android Bluetooth, Camera, Foxglove)" }
teleop = { cmd = "ros2 launch mdp_bringup teleop.launch.py", description = "Start manual teleop stack (Zenoh, STM32 UART, Android Bluetooth)" }
planner = { cmd = "ros2 run mdp_bringup planner_node", description = "Start the autonomous path planner on the Pi" }
fastest-car = { cmd = "ros2 run mdp_bringup fastest_car_node", description = "Start Task 2 fastest car sprint node on the Pi" }
perception = { cmd = "ros2 run mdp_perception perception_node", description = "Start local NCNN/ONNX target detection on the Pi" }
camera = { cmd = "ros2 launch mdp_camera_bringup camera.launch.py", description = "Start the Pi camera driver" }
foxglove = { cmd = "ros2 launch foxglove_bridge foxglove_bridge_launch.xml", description = "Start the Foxglove websocket bridge (ws://mdp.local:8765)" }

[feature.pi.activation]
scripts = ["scripts/activate_zenoh_pi.sh"]

# ----------------------------------------------------------------------------
# pc — compute-heavy nodes: YOLO perception, the Hamiltonian+Dubins planner,
# RViz2. Builds the whole workspace, including the Pi's packages, so the
# interfaces and the bridge's unit tests are available for development here.
# ----------------------------------------------------------------------------
[feature.pc]
platforms = ["osx-arm64", "linux-64"]

[feature.pc.activation]
scripts = ["scripts/activate_zenoh_pc.sh"]

[feature.pc.dependencies]
ros-jazzy-rviz2 = ">=14.1.20,<15"
ros-jazzy-cv-bridge = ">=4.1.0,<5"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-robot-state-publisher = ">=3.3.3,<4"
ros-jazzy-joint-state-publisher = ">=2.4.1,<3"
ros-jazzy-foxglove-bridge = "*"
ros-jazzy-ros-gz-sim = ">=1.0.22,<2"
ros-jazzy-ros-gz-bridge = ">=1.0.22,<2"
ros-jazzy-ros-gz-image = ">=1.0.22,<2"

[feature.pc.pypi-dependencies]
ultralytics = ">=8.4.127,<9"

# ONNX export (`model.export(format="onnx")`). Ultralytics tries to
# pip-install these on demand when missing, but this environment has no
# `pip` binary -- pixi's pypi-dependencies resolve through uv instead, so
# they need to be declared here rather than left to Ultralytics' runtime
# auto-install.
onnx = ">=1.12.0, <2"
onnxruntime = "*"
onnxslim = ">=0.1.82"

# NCNN export (`model.export(format="ncnn")`, used to produce
# models/best_ncnn_model/ for the Pi -- see raspberry-pi/cv/scripts/export_edge.sh).
# Same auto-install problem as the ONNX deps above: Ultralytics' torch2ncnn
# converter shells out to `pnnx` and then does `import ncnn` to finish the
# conversion, and both fail to auto-install here (no pip binary). ncnn itself
# is also needed on the Pi at inference time (see feature.pi.pypi-dependencies)
# but that's a separate install -- this one runs the *export*, on pc/sim.
ncnn = "*"
pnnx = "*"

[feature.pc.tasks]
# The trailing script is a macOS-only rpath fix for mdp_interfaces' Python
# typesupport extensions (see scripts/fix_macos_mdp_interfaces_rpath.sh for
# why) -- colcon regenerates those files from scratch on every build, so the
# fix has to be reapplied every time too. No-op on Linux.
build = { cmd = "colcon build && ./scripts/fix_macos_mdp_interfaces_rpath.sh", description = "Build the full workspace" }
test = { cmd = "colcon test", description = "Test the full workspace" }
perception = { cmd = "ros2 run mdp_perception perception_node", description = "Start the YOLO target detection and verification stitcher node" }
# Overrides the Tailscale endpoint activate_zenoh_pc.sh sets by default —
# for use when the Mac and Pi are on the same LAN (e.g. NTU Secure) instead
# of reaching each other over Tailscale's DERP relay. Update the IP in
# config/zenoh_client_pc_lan.json5 to the Pi's current LAN address first.
perception-lan = { cmd = "ZENOH_SESSION_CONFIG_URI=config/zenoh_client_pc_lan.json5 ros2 run mdp_perception perception_node", description = "Start perception using the same-LAN Zenoh config instead of Tailscale" }
export-onnx = { cmd = "python3 -c \"from ultralytics import YOLO; YOLO('../models/best.pt').export(format='onnx', imgsz=640, opset=12)\"", description = "Export models/best.pt to ONNX format for Pi edge inference" }
foxglove = { cmd = "ros2 launch foxglove_bridge foxglove_bridge_launch.xml", description = "Start local Foxglove websocket bridge on PC" }
sim-gz = { cmd = "env RMW_IMPLEMENTATION=rmw_cyclonedds_cpp ZENOH_SESSION_CONFIG_URI= ros2 launch mdp_simulation gz_sim.launch.py", description = "Launch Gazebo 3D simulation with robot and arena" }
sim-robot = { cmd = "env RMW_IMPLEMENTATION=rmw_cyclonedds_cpp ZENOH_SESSION_CONFIG_URI= ros2 launch mdp_simulation sim_robot.launch.py", description = "Launch Gazebo sim with full autonomous robot stack (planner, motion controller, perception)" }
sim-task2 = { cmd = "env RMW_IMPLEMENTATION=rmw_cyclonedds_cpp ZENOH_SESSION_CONFIG_URI= ros2 launch mdp_simulation sim_task2.launch.py", description = "Launch Gazebo sim for Task 2 (Fastest Car Reactive Sprint)" }
sim-teleop = { cmd = "env RMW_IMPLEMENTATION=rmw_cyclonedds_cpp ZENOH_SESSION_CONFIG_URI= ros2 launch mdp_simulation sim_teleop.launch.py", description = "Launch Gazebo sim with manual teleoperation" }


# ----------------------------------------------------------------------------
# sim — Gazebo (gz-sim / Harmonic, via ros_gz) for testing the planner and
# motion controller against a virtual robot instead of the physical hardware.
# Layered on top of pc (needs xacro, robot_state_publisher, rviz2 already
# declared there); adds only the gz-sim/ros_gz packages so plain `pc`
# installs (perception dev on a laptop with no GPU/Gazebo need) stay light.
# ----------------------------------------------------------------------------
[feature.sim]
platforms = ["osx-arm64", "linux-64"]

[feature.sim.dependencies]
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"

# `sim` still inherits pc's Zenoh/Tailscale activation script (pc is in its
# environment list), so if Tailscale is up it CAN still reach the same
# router the real Pi uses. These tasks force ROS_DOMAIN_ID=36 to isolate
# from that: rmw_zenoh_cpp folds the domain ID into its key expressions, so
# a session on domain 36 cannot discover or publish onto domain 16's topics
# no matter what it's connected to. Found the hard way — an early smoke test
# of `gazebo.launch.py` on the shared domain briefly mixed fake /robot_pose
# and /sensors/*/raw messages into the real serial_bridge_node's topics
# while it happened to be running.
#
# This is a per-task `env` override, not `[feature.sim.activation.env]`:
# pixi resolves a duplicate activation-env key by keeping whichever feature
# defines it first in this file, not the one relevant to the environment
# being run — so a `[feature.sim.activation.env]` override of
# ROS_DOMAIN_ID would silently lose to [feature.common.activation.env]'s
# "16" every time. Task-level `env` is applied at run time instead and
# reliably wins.
#
# RMW_IMPLEMENTATION=rmw_cyclonedds_cpp for the same reason test-bridge/
# test-planner above already use it: pc's activation script points
# rmw_zenoh_cpp's client config at the Pi's Tailscale IP as a *required*
# connection — with no Pi reachable, every node's rclpy.init() throws
# (zenohc::session: "Unable to connect", then RCLBadAlloc). The sim has no
# cross-host graph to join, so it doesn't need Zenoh at all; cyclonedds
# discovers peers over local UDP multicast with no router/config needed.
#
# DYLD_LIBRARY_PATH=install/mdp_interfaces/lib is a separate macOS-only
# workaround, and has to be a literal prefix inside `cmd` rather than in the
# `env` table above: pixi's own `env` field silently drops any DYLD_*-
# prefixed variable (a deliberate safety filter, confirmed by testing —
# ROS_DOMAIN_ID/RMW_IMPLEMENTATION in the same table work fine, only DYLD_
# vars vanish), whereas a plain shell-level `VAR=value cmd` prefix isn't
# filtered at all. It's needed because rmw_cyclonedds_cpp's C++ layer
# dlopen()s libmdp_interfaces__rosidl_typesupport_introspection_c.dylib by
# bare filename at runtime (to create any service/client using an
# mdp_interfaces type, e.g. motion_controller_node's /execute_moves or
# planner_node's client of it) — a lookup that only ever consults
# DYLD_LIBRARY_PATH/DYLD_FALLBACK_LIBRARY_PATH and the *calling* process's
# own rpath, never the target dylib's own directory. That's a fundamentally
# different loading path from the one rpath already fixes (see mdp_gazebo's
# rebuild step below): rpath fixes a compiled .so finding its own declared
# dependency; this fixes a raw runtime dlopen-by-name from someone else's
# code, which rpath can't reach at all.
[feature.sim.tasks]
gazebo = { cmd = "DYLD_LIBRARY_PATH=\"$PWD/install/mdp_interfaces/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}\" ros2 launch mdp_gazebo gazebo.launch.py", description = "Launch the Gazebo arena with the simulated robot (world, spawn, cmd_vel/odom bridge, pose+TF publisher)", env = { ROS_DOMAIN_ID = "36", RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp" } }
gazebo-autonomous = { cmd = "DYLD_LIBRARY_PATH=\"$PWD/install/mdp_interfaces/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}\" ros2 launch mdp_gazebo gazebo.launch.py run_autonomous:=true", description = "Launch Gazebo plus motion_controller_node and planner_node for a full autonomous run against the sim", env = { ROS_DOMAIN_ID = "36", RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp" } }

[environments]
pi = ["common", "pi"]
pc = ["common", "pc"]
sim = ["common", "pc", "sim"]
