[workspace]
name = "mdp-ros2-ws"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]

[dependencies]
# Base ROS dependencies
ros-jazzy-ros-base = "*"
pkg-config = "*"
compilers = "*"
make = "*"
ninja = "*"
ros-jazzy-ros2cli = "*"

# Build tools
colcon-common-extensions = "*"

# Workspace dependencies
ros-jazzy-rclpy = "*"
ros-jazzy-vision-msgs = ">=4.1.1,<5"
ros-jazzy-cv-bridge = ">=4.1.0,<5"
ros-jazzy-image-transport = ">=5.1.7,<6"
pyserial = ">=3.5,<4"
ros-jazzy-tf2-ros = ">=0.36.20,<0.37"
ros-jazzy-tf2-geometry-msgs = ">=0.36.20,<0.37"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-robot-state-publisher = ">=3.3.3,<4"
ros-jazzy-joint-state-publisher = ">=2.4.1,<3"
ros-jazzy-rviz2 = ">=14.1.20,<15"
ros-jazzy-compressed-image-transport = ">=4.0.7,<5"

[tasks]
build = {cmd = "colcon build", description = "Build the ROS workspace"}
test = {cmd = "colcon test", description = "Run tests for the workspace"}
clean = {cmd = "rm -rf build install log", description = "Clean build artifacts (build, install, log directories)"}

# Scripts to source on environment activation, found after first colcon build.

[activation]
scripts = ["install/setup.bash"]

[activation.env]
# Group 16's dedicated ROS2 domain. On demo day this runs on its own
# router/hotspot (isolated broadcast domain, no other MDP groups on the
# same subnet), so this isn't preventing cross-team collisions — it's just
# hygiene against any other stray ROS2 process on domain 0. Must match on
# every machine joining this graph (Pi, this Mac, any other host).
ROS_DOMAIN_ID = "16"

[pypi-dependencies]
ultralytics = ">=8.4.127, <9"
