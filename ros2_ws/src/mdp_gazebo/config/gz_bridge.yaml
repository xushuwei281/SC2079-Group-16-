# ros_gz_bridge topic config. cmd_vel is consumed by the DiffDrive plugin
# from ROS (motion_controller_node is the real publisher, unmodified);
# odom is produced by the same plugin and consumed on the ROS side by
# sim_bridge_node, which turns it into the /robot_pose(/raw) PoseStamped
# contract the rest of the stack expects from real hardware.
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "sim/odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
