; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F407VET6]
platform = ststm32
board = genericSTM32F407VET6
framework = stm32cube
upload_protocol = serial
; C30D Port 1 uses a CH9102F one-key download circuit on USART1.
; Drive RTS/DTR to select BOOT0 and pulse NRST automatically.
upload_port = /dev/ttyACM0
upload_flags =
    -i
    rts,-dtr,dtr,-rts:-rts,-dtr
debug_tool = stlink
extra_scripts = pre:extra_script.py
; ststm32's default toolchain range (>=1.60301.0,<1.80000.0) has no
; linux_aarch64 build (only x86_64/i686/darwin/windows at 1.60301.0, and
; 32-bit ARM at 1.70201.0) -- fails to resolve on a 64-bit Raspberry Pi OS
; host. Pinning a newer release that has linux_aarch64 (and still covers
; darwin_arm64/linux_x86_64, so this doesn't affect other hosts).
platform_packages =
    platformio/toolchain-gccarmnoneeabi@^1.120301.0
build_flags =
    -I lib/FreeRTOS/include/portable/GCC/ARM_CM4F
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    ; GCC 14 (pulled in by the linux_aarch64 toolchain pin above) makes
    ; implicit-function-declaration a hard error by default, where the
    ; old 2017-era toolchain only warned -- the ported firmware source
    ; relies on that leniency (missing <string.h>/<stdlib.h> includes,
    ; a few missing prototypes). Restore old behavior rather than editing
    ; STM_Ref-derived source for a toolchain version bump.
    -Wno-error=implicit-function-declaration
